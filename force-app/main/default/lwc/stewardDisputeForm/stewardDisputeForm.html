<template>
  <template lwc:if={loading}>
    <p role="status">Loading the form…</p>
  </template>
  <template lwc:elseif={problem}>
    <p class="notice" role="alert">{problem}</p>
  </template>
  <template lwc:elseif={result}>
    <div class="card" aria-live="polite">
      <h3 class="card-title" tabindex="-1" lwc:ref="resultHeading">
        {result.heading}
      </h3>
      <p>{result.text}</p>
      <template lwc:if={result.evidence}>
        <ul class="bullets">
          <template for:each={result.evidence} for:item="item">
            <li key={item.key}>{item.text}</li>
          </template>
        </ul>
      </template>
      <template lwc:if={result.caseId}>
        <p class="next">
          <a
            href={result.caseUrl}
            data-id={result.caseId}
            onclick={handleOpenCase}
            >Go to dispute {result.caseNumber}</a
          >
        </p>
      </template>
      <lightning-button
        label="Open another dispute"
        onclick={handleStartAgain}
      ></lightning-button>
    </div>
  </template>
  <template lwc:else>
    <template lwc:if={hasOpenChoices}>
      <div class="card">
        <lightning-radio-group
          data-field="statement"
          name="statement"
          label="Which statement is wrong?"
          options={statementOptions}
          value={statementId}
          onchange={handleStatement}
          required
        ></lightning-radio-group>
        <lightning-combobox
          class="field"
          data-field="reason"
          name="reason"
          label="What's wrong with it?"
          placeholder="Choose a reason"
          options={reasonOptions}
          value={reason}
          onchange={handleReason}
          required
        ></lightning-combobox>
        <template lwc:if={evidence}>
          <div class="field">
            <p class="evidence-title">What you'll need to send</p>
            <ul class="bullets">
              <template for:each={evidence} for:item="item">
                <li key={item.key}>{item.text}</li>
              </template>
            </ul>
          </div>
        </template>
        <lightning-textarea
          class="field"
          name="description"
          label="Anything else we should know? (optional)"
          field-level-help="Please don't include card or bank account numbers."
          max-length="2000"
          value={description}
          onchange={handleDescription}
        ></lightning-textarea>
        <lightning-button
          class="field"
          variant="brand"
          label="Open the dispute"
          disabled={submitting}
          onclick={handleSubmit}
        ></lightning-button>
      </div>
    </template>
    <template lwc:else>
      <p>There are no statements you can open a new dispute on.</p>
    </template>
    <template lwc:if={hasDisputedStatements}>
      <p class="evidence-title">Already in dispute</p>
      <ul class="bullets">
        <template for:each={disputedStatements} for:item="statement">
          <li key={statement.statementId}>
            {statement.label}:
            <a
              href={statement.disputeUrl}
              data-id={statement.disputeCaseId}
              onclick={handleOpenCase}
              >dispute {statement.disputeCaseNumber}</a
            >
          </li>
        </template>
      </ul>
    </template>
  </template>
</template>
