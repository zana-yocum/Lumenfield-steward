<template>
  <section class="page">
    <h1 class="page-title">{labels.statements}</h1>
    <template lwc:if={loading}>
      <p role="status">{labels.statementsLoading}</p>
    </template>
    <template lwc:elseif={problem}>
      <p class="notice" role="alert">{problem}</p>
    </template>
    <template lwc:elseif={hasStatements}>
      <p class="lead">{labels.statementsLead}</p>
      <ul class="plain-list">
        <template for:each={statements} for:item="statement">
          <li key={statement.statementId}>
            <c-portal-statement-card
              statement={statement}
              link-to-detail
            ></c-portal-statement-card>
          </li>
        </template>
      </ul>
    </template>
    <template lwc:else>
      <p>{labels.noStatements}</p>
    </template>
  </section>
</template>
