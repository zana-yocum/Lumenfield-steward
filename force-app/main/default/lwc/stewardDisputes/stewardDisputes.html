<template>
  <section class="page">
    <h1 class="page-title">Disputes</h1>
    <p class="lead">
      If a statement looks wrong, tell us here. A dispute specialist reviews
      every dispute, and we'll tell you exactly what to send.
    </p>
    <h2 class="section-title">Open a dispute</h2>
    <c-steward-dispute-form
      ondisputeopened={handleOpened}
    ></c-steward-dispute-form>
    <h2 class="section-title">Your disputes</h2>
    <template lwc:if={loading}>
      <p role="status">Loading your disputes…</p>
    </template>
    <template lwc:elseif={problem}>
      <p class="notice" role="alert">{problem}</p>
    </template>
    <template lwc:elseif={hasDisputes}>
      <ul class="plain-list">
        <template for:each={disputes} for:item="dispute">
          <li key={dispute.key}>
            <article class="card">
              <h3 class="card-title">
                <a
                  href={dispute.url}
                  data-id={dispute.caseId}
                  onclick={handleOpenDispute}
                  >{dispute.title}</a
                >
              </h3>
              <dl class="details">
                <template for:each={dispute.details} for:item="detail">
                  <div key={detail.label}>
                    <dt>{detail.label}</dt>
                    <dd>{detail.value}</dd>
                  </div>
                </template>
              </dl>
            </article>
          </li>
        </template>
      </ul>
    </template>
    <template lwc:else>
      <p>You haven't opened any disputes.</p>
    </template>
  </section>
</template>
