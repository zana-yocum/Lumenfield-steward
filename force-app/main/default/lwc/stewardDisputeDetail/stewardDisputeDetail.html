<template>
  <section class="page">
    <h1 class="page-title">{title}</h1>
    <template lwc:if={loading}>
      <p role="status">Loading the dispute…</p>
    </template>
    <template lwc:elseif={problem}>
      <p class="notice" role="alert">{problem}</p>
    </template>
    <template lwc:else>
      <dl class="details">
        <template for:each={details} for:item="detail">
          <div key={detail.label}>
            <dt>{detail.label}</dt>
            <dd>{detail.value}</dd>
          </div>
        </template>
        <div>
          <dt>Statement</dt>
          <dd>
            <a href={statementUrl} onclick={handleStatement}
              >{dispute.statementNumber}</a
            >
          </dd>
        </div>
      </dl>
      <h2 class="section-title">What to send</h2>
      <ul class="bullets">
        <template for:each={evidence} for:item="item">
          <li key={item.key}>
            <span class="need">{item.need}:</span> {item.text}
          </li>
        </template>
      </ul>
      <template lwc:if={isOpen}>
        <h2 class="section-title">Upload your evidence</h2>
        <p class="lead">PDF files or photos. You can add several at once.</p>
        <lightning-file-upload
          label="Add files"
          name="evidence"
          record-id={caseId}
          accept={acceptedFormats}
          multiple
          onuploadfinished={handleUploadFinished}
        ></lightning-file-upload>
        <p class="upload-message" role="status">{uploadMessage}</p>
      </template>
      <template lwc:else>
        <p>This dispute is closed, so it can't take new files.</p>
      </template>
    </template>
    <p>
      <a href={disputesUrl} onclick={handleBack}>Back to your disputes</a>
    </p>
  </section>
</template>
