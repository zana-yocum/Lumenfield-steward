<template>
  <section class="page">
    <h1 class="page-title">{title}</h1>
    <template lwc:if={loading}>
      <p role="status">{labels.statementLoading}</p>
    </template>
    <template lwc:elseif={problem}>
      <p class="notice" role="alert">{problem}</p>
    </template>
    <template lwc:else>
      <c-portal-statement-card
        statement={statement}
        hide-title
      ></c-portal-statement-card>
      <c-portal-payment
        statement-id={statement.statementId}
        balance={statement.balance}
        session-id={paymentSession}
        cancelled={paymentCancelled}
        onrefresh={handleRefresh}
      ></c-portal-payment>
    </template>
    <p>
      <a href={statementsUrl} onclick={handleBack}>{labels.backToStatements}</a>
    </p>
  </section>
</template>
