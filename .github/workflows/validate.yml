# ST-13 · S-05 · S-12 · NFR-03
# Runs on every pull request to main. Checks formatting, runs component tests and
# static analysis, then asks the org to validate the deployment with local Apex
# tests and checks every Steward class is at 90% coverage or more. Nothing is
# deployed here; the validation's job ID is kept for the merge.
name: Validate

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: write # Code Analyzer posts its summary on the pull request
    steps:
      - name: Check out the pull request
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install project tools
        run: npm ci

      - name: Check formatting (Prettier)
        run: npm run prettier:verify

      - name: Component tests (Jest)
        run: |
          if [ -d force-app/main/default/lwc ]; then
            npm run test:unit
          else
            echo "No Lightning web components yet, so there's nothing to test."
          fi

      - name: Test the coverage gate script
        run: python3 -m unittest discover -s tests/pipeline -v

      - name: Install the Salesforce CLI and Code Analyzer
        run: |
          npm install --global @salesforce/cli
          sf plugins install code-analyzer@latest
          sf --version

      - name: Static analysis (Code Analyzer)
        id: code-analyzer
        uses: forcedotcom/run-code-analyzer@v2
        with:
          run-arguments: --workspace force-app --view detail --output-file code-analyzer-results.html --output-file code-analyzer-results.json
          results-artifact-name: code-analyzer-results
          github-token: ${{ github.token }}

      - name: Stop on critical or high findings
        if: |
          steps.code-analyzer.outputs.exit-code > 0 ||
          steps.code-analyzer.outputs.num-sev1-violations > 0 ||
          steps.code-analyzer.outputs.num-sev2-violations > 0
        run: |
          echo "::error::Code Analyzer found critical or high-severity issues. Details are in the code-analyzer-results artifact."
          exit 1

      - name: Sign in to the org as Steward CI (JWT)
        env:
          SF_CLIENT_ID: ${{ secrets.SF_CLIENT_ID }}
          SF_PRIVATE_KEY: ${{ secrets.SF_PRIVATE_KEY }}
          SF_USERNAME: ${{ secrets.SF_USERNAME }}
          SF_INSTANCE_URL: ${{ secrets.SF_INSTANCE_URL }}
        run: |
          key_file="$RUNNER_TEMP/steward-ci.key"
          printf '%s\n' "$SF_PRIVATE_KEY" > "$key_file"
          sf org login jwt --client-id "$SF_CLIENT_ID" --jwt-key-file "$key_file" \
            --username "$SF_USERNAME" --instance-url "$SF_INSTANCE_URL" --alias ci --set-default
          rm -f "$key_file"

      - name: Validate the deployment (check-only, local Apex tests)
        run: |
          set +e
          sf project deploy validate --source-dir force-app --test-level RunLocalTests --wait 60 --json > validate.json
          code=$?
          set -e
          jq '{status: .result.status, jobId: .result.id, components: .result.numberComponentsDeployed, componentErrors: .result.numberComponentErrors, testsRun: .result.numberTestsCompleted, testErrors: .result.numberTestErrors}' validate.json || true
          if [ "$code" -ne 0 ]; then
            echo "::error::The org rejected this deployment. The full response is below."
            cat validate.json
            exit "$code"
          fi
          jq -r '.result.id' validate.json > validation-id.txt
          echo "Validation job ID: $(cat validation-id.txt)"

      # The org's own rule is 75% across all code. Steward's is 90% for every class on its
      # own (ST-13, NFR-03). If this fails, the job ID isn't kept, so nothing can deploy.
      - name: Coverage gate (90% per class)
        env:
          COVERAGE_GATE_PCT: "90"
        run: python3 scripts/check_coverage.py validate.json force-app "$COVERAGE_GATE_PCT"

      - name: Keep the validation job ID for the merge
        uses: actions/upload-artifact@v6
        with:
          name: validation-id
          path: validation-id.txt
          retention-days: 10
