# ST-13 · S-05 · S-12 · S-13 · S-17
# Runs when a merge to main changes org metadata. Finds the pull request behind the
# merge and quick-deploys the validation that passed on it. If Salesforce won't accept
# the quick deploy, it deploys again with the same tests. A change to force-app/ that
# didn't come through a validated pull request is refused. When the pull request
# changed anything the customer portal shows, the portal is published afterwards.
name: Deploy

on:
  push:
    branches: [main]
    paths:
      - "force-app/**"

permissions:
  contents: read
  actions: read # read the pull request's validation run
  pull-requests: read # find the pull request behind this merge

concurrency:
  group: deploy-org
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out main
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install the Salesforce CLI
        run: |
          npm install --global @salesforce/cli
          sf --version

      - name: Find the pull request and its validation
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          pr=$(gh api "repos/$REPO/commits/$SHA/pulls" --jq '[.[] | select(.merged_at != null)][0].number // empty')
          if [ -z "$pr" ]; then
            echo "::error::This change reached main without a merged pull request. Org changes have to come through a pull request (ST-13, S-13)."
            exit 1
          fi
          head=$(gh api "repos/$REPO/pulls/$pr" --jq '.head.sha')
          run=$(gh run list --workflow validate.yml --commit "$head" --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [ -z "$run" ]; then
            echo "::error::Pull request #$pr has no passing validation for its final commit ($head)."
            exit 1
          fi
          gh run download "$run" --name validation-id --dir "$RUNNER_TEMP/validation"
          job_id=$(cat "$RUNNER_TEMP/validation/validation-id.txt")
          echo "Pull request #$pr was validated in run $run as job $job_id"
          echo "job_id=$job_id" >> "$GITHUB_OUTPUT"
          echo "pr=$pr" >> "$GITHUB_OUTPUT"

      - name: Sign in to the org as Steward CI (JWT)
        env:
          SF_CLIENT_ID: ${{ secrets.SF_CLIENT_ID }}
          SF_PRIVATE_KEY: ${{ secrets.SF_PRIVATE_KEY }}
          SF_USERNAME: ${{ secrets.SF_USERNAME }}
          SF_INSTANCE_URL: ${{ secrets.SF_INSTANCE_URL }}
        run: |
          key_file="$RUNNER_TEMP/steward-ci.key"
          printf '%s\n' "$SF_PRIVATE_KEY" > "$key_file"
          sf org login jwt --client-id "$SF_CLIENT_ID" --jwt-key-file "$key_file" \
            --username "$SF_USERNAME" --instance-url "$SF_INSTANCE_URL" --alias ci --set-default
          rm -f "$key_file"

      - name: Deploy
        env:
          JOB_ID: ${{ steps.find.outputs.job_id }}
        run: |
          if sf project deploy quick --job-id "$JOB_ID" --wait 60; then
            echo "Deployed by quick deploy of validation $JOB_ID."
          else
            echo "::warning::Salesforce didn't accept a quick deploy of $JOB_ID. Deploying again with local Apex tests."
            sf project deploy start --source-dir force-app --test-level RunLocalTests --wait 60
          fi

      # An LWR site serves the copy that was last published, so new pages and component
      # changes reach customers only when it's published again. Publishing runs in the
      # background in the org; the step waits for it and fails if it doesn't finish.
      - name: Publish the customer portal if it changed
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ steps.find.outputs.pr }}
          SITE: Lumenfield Customer Portal
        run: |
          shown='^force-app/main/default/(digitalExperiences|digitalExperienceConfigs|lwc|navigationMenus|networks|sites)/'
          if ! gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[].filename' | grep -qE "$shown"; then
            echo "Pull request #$PR changed nothing the portal shows, so the portal isn't republished."
            exit 0
          fi
          job=$(sf community publish --name "$SITE" --json | jq -r '.result.jobId // empty')
          if [ -z "$job" ]; then
            echo "::error::Salesforce didn't start publishing $SITE."
            exit 1
          fi
          echo "Publishing $SITE as background job $job."
          for _ in $(seq 1 40); do
            status=$(sf data query --query "SELECT Status FROM BackgroundOperation WHERE Id = '$job'" --json | jq -r '.result.records[0].Status // empty')
            case "$status" in
              Complete)
                echo "$SITE is published."
                exit 0
                ;;
              Error | Canceled)
                echo "::error::Publishing $SITE ended with status $status. See Setup > Background Jobs."
                exit 1
                ;;
            esac
            sleep 15
          done
          echo "::error::Publishing $SITE didn't finish within 10 minutes. See Setup > Background Jobs."
          exit 1
